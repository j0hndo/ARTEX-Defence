services:
  canary:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CANARY_BIND: 0.0.0.0
      CANARY_PORT: "8000"
      CANARY_LOG: /var/log/canary/events.jsonl
      CANARY_ALLOWED_HOSTS: ${CANARY_ALLOWED_HOSTS:-127.0.0.1,localhost}
      CANARY_TTL_SECONDS: ${CANARY_TTL_SECONDS:-900}
      CANARY_MAX_ACTIVE_RUNS: ${CANARY_MAX_ACTIVE_RUNS:-1024}
      CANARY_POLICY: ${CANARY_POLICY:-observe}
      CANARY_TRUSTED_PROXY_CIDRS: ${CANARY_TRUSTED_PROXY_CIDRS:-}
    volumes:
      - canary-logs:/var/log/canary
    read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).close()
      interval: 10s
      timeout: 3s
      retries: 3

  demo:
    image: nginx:1.27-alpine
    depends_on:
      canary:
        condition: service_healthy
    ports:
      - 127.0.0.1:18091:80
    volumes:
      - ./examples/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./examples/demo:/usr/share/nginx/html:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

volumes:
  canary-logs:
