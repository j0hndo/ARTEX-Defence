server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;

    location = /support {
        try_files /support.html =404;
    }

    location ^~ /sys/sso-status/ {
        # Decoy URLs carry one-time synthetic gate and digest values.
        access_log off;
        error_log /dev/stderr crit;
        proxy_pass http://canary:8000;
        proxy_http_version 1.1;
        # Forward only gateway-generated headers. Drop client cookies and auth.
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Canary-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
