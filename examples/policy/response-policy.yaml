# Vendor-neutral response policy example. This file is documentation only.
# The canary server does not load it. Translate it into your edge or app policy.
# X-Canary-Request-ID identifies only the final verification request.
# A completed run can be handed to another client as a URL. It does not prove
# that the final requester performed the earlier stages.
example_only: true
trigger:
  event: canary_match
default_action: observe
correlation:
  # Use this only to find the final request for investigation. The sidecar
  # accepts it only from a trusted proxy.
  join_key: request_id
  edge_record:
    required_path: /sys/sso-status/verifySSOStatus
    required_fields:
      - generated_request_id
      - timestamp
    max_age_seconds: 60
    require_unique_match: true
actions:
  validated_match:
    action: alert_and_manual_review
    scope: canary_event
# The sidecar's separate CANARY_POLICY=deny_verify setting returns 403 on the
# current decoy request. It does not act on an application session.
guardrails:
  require_trigger_event: canary_match
  automatic_session_or_ip_enforcement: false
  future_enforcement_requires:
    - independently_verified_same_actor_across_all_six_stages
    - final_url_replay_and_cross_session_handoff_controls
    - local_validation_against_normal_users_and_adversarial_replay
  keep_application_requests_observable: true
