# Include this file inside the existing public Nginx server block.
# First include canary-rate-limit-http.conf once in the outer http {} block.
# Keep the app's other locations and authentication configuration intact.
location ^~ /sys/sso-status/ {
    # All canary paths are bounded. Overview has a second, lower capacity limit.
    limit_req zone=canary_all_global burst=20 nodelay;
    limit_req zone=canary_overview_global burst=10 nodelay;
    limit_req_status 429;
    limit_conn canary_conn_global 32;
    limit_conn_status 429;
    client_max_body_size 1k;

    # Synthetic gates and signatures are in the query string.
    access_log off;
    error_log /dev/stderr crit;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store" always;

    # The sidecar port is published on the host loopback interface only.
    # No trailing slash: preserve the full /sys/sso-status/ URI.
    proxy_pass http://127.0.0.1:19091;
    proxy_http_version 1.1;

    # Forward only gateway-generated headers, never client cookies or auth.
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Canary-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
}
