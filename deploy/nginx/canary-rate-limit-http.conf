# Include once in Nginx's http {} block before loading the app server block.
# Empty keys exempt unrelated app paths. Constant keys set global limits
# across hosts served by this Nginx instance.
map $uri $canary_overview_key {
    default "";
    /sys/sso-status/overview canary-overview;
}
map $uri $canary_all_key {
    default "";
    ~^/sys/sso-status/ canary-all;
}
limit_req_zone $canary_overview_key zone=canary_overview_global:1m rate=2r/s;
limit_req_zone $canary_all_key zone=canary_all_global:1m rate=10r/s;
limit_conn_zone $canary_all_key zone=canary_conn_global:1m;
